name: Build overlay

on:
  push:
    branches:
      - release
    paths:
      - packages/overlay/**
  workflow_dispatch:

jobs:
  version_check:
    runs-on: "ubuntu-latest"

    defaults:
      run:
        shell: bash
        working-directory: ./packages/overlay

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4.0.0
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: ./packages/overlay/pnpm-lock.yaml

      - name: Install pnpm packages
        run: pnpm install

      - name: Check for an existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tauri_version=$(node scripts/version.mjs)
          echo "Tauri version: $tauri_version"
          if gh release view "overlay-v$tauri_version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "A release for this version already exists, bump the version in tauri.conf.json"
            exit 1
          fi

  build:
    needs: "version_check"

    permissions:
      contents: write
      id-token: write
      attestations: write

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
          - platform: "ubuntu-22.04"
            args: ""

    runs-on: ${{ matrix.platform }}

    defaults:
      run:
        shell: bash
        working-directory: ./packages/overlay

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4.0.0
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: |
            ./packages/overlay/pnpm-lock.yaml
            ./packages/mtc-artillery/pnpm-lock.yaml

      - name: Install pnpm packages
        run: pnpm install

      # the calculator is bundled into the overlay
      - name: Install pnpm packages (mtc-artillery)
        run: pnpm install
        working-directory: ./packages/mtc-artillery

      - name: Install dependencies (ubuntu)
        if: matrix.platform == 'ubuntu-22.04' # This must match the platform value defined above.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Get workflow run URL
        id: workflow_url
        run: |
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          echo "url=$url" >> $GITHUB_OUTPUT

      - uses: tauri-apps/tauri-action@v0
        id: tauri_build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: overlay-v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: "Overlay v__VERSION__"
          releaseBody: |
            View the workflow summary [here](${{ steps.workflow_url.outputs.url }}).

            See the assets to download this version and install.

            ```
            x86_64.rpm = linux
            amd64.appimage = linux
            amd64.deb = linux
            x64-setup.exe = windows
            x64_en-US.msi = windows
            ```
          releaseDraft: false
          prerelease: false
          projectPath: ./packages/overlay
          args: ${{ matrix.args }}

      - name: Convert artifact paths
        id: artifact_paths
        run: |
          json='${{ steps.tauri_build.outputs.artifactPaths }}' # must use single quotes
          list="$(echo $json | jq -r '. | join(", ")')"
          echo "list=$list" >> $GITHUB_OUTPUT

      - uses: actions/attest-build-provenance@v1
        # attestations aren't available for every repository
        continue-on-error: true
        with:
          subject-path: ${{ steps.artifact_paths.outputs.list }}
